name: CI

# None of these jobs changes SSH, firewall or service state of the runner:
# unit tests use a fake host; integration tests call sshd/fail2ban-client only as
# read-only configuration checkers against throwaway directories.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check bant tests
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x install.sh
          shellcheck -s sh scripts/emergency-recovery.sh

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Unit tests (fake host)
        run: python -m pytest tests/unit -q

  integration:
    # Real sshd / fail2ban-client binaries, read-only, against temporary config trees.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenSSH server and Fail2ban without starting them
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server fail2ban python3-systemd shellcheck iproute2
          sudo mkdir -p /run/sshd
      - run: pip install -e ".[dev]"
      - name: Integration tests (sudo only so sshd can read its own throwaway host key)
        run: sudo -E env "PATH=$PATH" python -m pytest tests/integration tests/system -q
      - name: Installer smoke test (DESTDIR, no system changes)
        run: |
          DESTDIR="$RUNNER_TEMP/dest" bash install.sh --yes
          python3 -I -c "import sys; sys.path.insert(0, '$RUNNER_TEMP/dest/opt/bant/lib'); from bant.cli import main; sys.exit(main())" version
