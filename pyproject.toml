[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bant"
dynamic = ["version"]
description = "Lightweight Linux VPS security manager: safe SSH hardening, Fail2ban, firewall-aware IP management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bant contributors" }]
keywords = ["security", "ssh", "fail2ban", "vps", "hardening"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "rich>=11.2",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
bant = "bant.cli:main"

[project.urls]
Homepage = "https://github.com/VAR7IANT/Bant"

[tool.setuptools.dynamic]
version = { attr = "bant.__version__" }

[tool.setuptools.packages.find]
include = ["bant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real binaries (sshd, fail2ban-client) against throwaway config; never touches the host",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
